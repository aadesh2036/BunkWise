<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BunkWise — Know your attendance. Know your freedom.</title>
  <meta name="description" content="Student attendance and timetable planning engine. Calculate exactly which upcoming classes you can safely miss without falling below your 75% target."/>
  
  <!-- Pixel Cat Favicon SVG -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 fill=%22%2318181B%22><path d=%22M2 2h3v2H2V2zm9 0h3v2h-3V2zM1 4h2v2H1V4zm12 0h2v2h-2V4zM2 6h12v6H2V6zm2 2h2v2H4V8zm6 0h2v2h-2V8zm-3 2h2v1H7v-1zm-4 2h10v2H3v-2z%22/></svg>">

  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#F7F7F5",
            "on-surface": "#18181B",
            "primary": "#0F766E",
            "primary-container": "#A7F3D0",
            "on-primary-container": "#064E3B",
            "error": "#DC2626"
          },
          fontFamily: {
            "headline": ["Hanken Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="bg-surface font-mono text-on-surface antialiased min-h-screen flex flex-col pb-20 md:pb-0">

  <!-- Top Navigation Header -->
  <header class="fixed top-0 left-0 w-full z-50 bg-white border-b-2 border-[#18181B] shadow-[0_2px_0px_#18181B]">
    <div class="h-14 max-w-5xl mx-auto px-4 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="#" onclick="App.navigateTo('landing'); return false;" class="flex items-center gap-2 select-none" title="BunkWise Home">
        <span class="w-6 h-6 flex items-center justify-center bg-slate-100 border border-[#18181B] rounded text-slate-900" id="header-logo-icon"></span>
        <div class="flex items-center gap-1.5">
          <span class="font-headline text-lg font-bold tracking-tight text-[#18181B]">BunkWise</span>
          <span class="px-1.5 py-0.2 bg-slate-100 text-slate-700 text-[10px] font-bold border border-slate-300 rounded">v1.1</span>
        </div>
      </a>

      <!-- Desktop Nav Tabs -->
      <nav class="hidden md:flex items-center gap-1">
        <button data-nav-tab="landing" class="nav-tab-btn">
          <span class="px-tab-icon" data-icon="home"></span>
          <span>Home</span>
        </button>
        <button data-nav-tab="dashboard" class="nav-tab-btn active">
          <span class="px-tab-icon" data-icon="dashboard"></span>
          <span>Dashboard</span>
        </button>
        <button data-nav-tab="timetable" class="nav-tab-btn">
          <span class="px-tab-icon" data-icon="calendar"></span>
          <span>Timetable</span>
        </button>
        <button data-nav-tab="attendance" class="nav-tab-btn">
          <span class="px-tab-icon" data-icon="chart"></span>
          <span>Attendance</span>
        </button>
        <button data-nav-tab="planner" class="nav-tab-btn">
          <span class="px-tab-icon" data-icon="planner"></span>
          <span>Planner</span>
        </button>
        <button data-nav-tab="settings" class="nav-tab-btn">
          <span class="px-tab-icon" data-icon="settings"></span>
          <span>Vault</span>
        </button>
      </nav>

      <!-- Right Side Actions -->
      <div class="flex items-center gap-2">
        <button onclick="App.openTimetableModal()" class="hidden sm:inline-flex bw-btn text-xs py-1 px-2.5 bg-yellow-50 hover:bg-yellow-100 border-amber-600" title="Timetable Setup">
          <span class="px-tab-icon" data-icon="upload"></span>
          <span>Timetable</span>
        </button>

        <button onclick="App.openTimetableModal()" class="sm:hidden w-8 h-8 rounded bg-yellow-50 hover:bg-yellow-100 flex items-center justify-center border border-amber-500" title="Timetable Setup">
          <span class="px-btn-icon" data-icon="upload"></span>
        </button>

        <div id="header-pulse-badge" class="hidden sm:flex items-center gap-1.5 px-2 py-0.5 bg-red-50 border border-slate-300 rounded text-xs font-bold text-red-700">
          <span class="w-2 h-2 rounded-full bg-red-600"></span>
          <span>64.96% (Below 75%)</span>
        </div>

        <button onclick="App.navigateTo('settings')" class="w-8 h-8 rounded bg-slate-50 hover:bg-slate-100 flex items-center justify-center border border-slate-300" title="Settings">
          <span class="px-btn-icon" data-icon="settings"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main View Area -->
  <main class="w-full pt-16 mt-2 px-3 sm:px-4 flex-1 max-w-5xl mx-auto">
    <div id="app-main-content">
      <!-- Views dynamically rendered here via Vanilla JS -->
    </div>
  </main>

  <!-- Mobile Bottom Sticky Navigation -->
  <nav class="md:hidden fixed bottom-0 left-0 w-full bg-white border-t-2 border-[#18181B] z-40 flex items-center justify-around px-0.5 py-1">
    <button data-mobile-tab="landing" class="mobile-nav-btn">
      <span class="px-tab-icon" data-icon="home"></span>
      <span>Home</span>
    </button>
    <button data-mobile-tab="dashboard" class="mobile-nav-btn active">
      <span class="px-tab-icon" data-icon="dashboard"></span>
      <span>Dashboard</span>
    </button>
    <button data-mobile-tab="timetable" class="mobile-nav-btn">
      <span class="px-tab-icon" data-icon="calendar"></span>
      <span>Timetable</span>
    </button>
    <button data-mobile-tab="attendance" class="mobile-nav-btn">
      <span class="px-tab-icon" data-icon="chart"></span>
      <span>Attendance</span>
    </button>
    <button data-mobile-tab="planner" class="mobile-nav-btn">
      <span class="px-tab-icon" data-icon="planner"></span>
      <span>Planner</span>
    </button>
    <button data-mobile-tab="settings" class="mobile-nav-btn">
      <span class="px-tab-icon" data-icon="settings"></span>
      <span>Vault</span>
    </button>
  </nav>

  <!-- Footer -->
  <footer class="w-full bg-white border-t border-slate-200 py-5 mt-10">
    <div class="max-w-5xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-500">
      <div class="flex items-center gap-1.5">
        <strong class="text-slate-800">BunkWise</strong>
        <span>• Know your attendance. Know your freedom.</span>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="App.openTimetableModal()" class="hover:underline font-bold text-slate-700">
          Upload / Demo Timetable
        </button>
        <span>•</span>
        <button onclick="SettingsView.resetToStudentDemo()" class="underline font-bold text-slate-700">
          Reset Demo Data
        </button>
      </div>
    </div>
  </footer>

  <!-- Scripts in dependency order -->
  <script src="js/core/icons.js"></script>
  <script src="js/data/demo-data.js"></script>
  <script src="js/core/bunk-engine.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/date-utils.js"></script>
  <script src="js/ocr/ocr-service.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/timetable-modal.js"></script>
  <script src="js/ui/landing-view.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/timetable-view.js"></script>
  <script src="js/ui/attendance-view.js"></script>
  <script src="js/ui/planner-view.js"></script>
  <script src="js/ui/settings-view.js"></script>
  <script src="js/app.js"></script>

  <!-- Hydrate pixel icons in static HTML elements -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const logoIcon = document.getElementById("header-logo-icon");
      if (logoIcon && window.PixelIcon) {
        logoIcon.innerHTML = PixelIcon.get('cat');
      }

      document.querySelectorAll("[data-icon]").forEach(el => {
        const iconName = el.getAttribute("data-icon");
        if (window.PixelIcon && PixelIcon.icons[iconName]) {
          el.innerHTML = PixelIcon.get(iconName);
        }
      });
    });
  </script>

</body>
</html>
