<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>BunkWise — Know your attendance. Know your freedom.</title>
  <meta name="description" content="College student attendance & timetable decision engine. Calculate exactly which upcoming classes you can safely miss without falling below your 75% target."/>
  
  <!-- Favicon Emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 width=%22100%22 height=%22100%22><text y=%22.9em%22 font-size=%2290%22>😼</text></svg>">

  <!-- Typography & Material Symbols Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#F9F9F6",
            "surface-container": "#EEEEEB",
            "surface-container-high": "#E8E8E5",
            "surface-container-lowest": "#FFFFFF",
            "on-surface": "#18181B",
            "primary": "#10B981",
            "primary-container": "#A7F3D0",
            "on-primary-container": "#064E3B",
            "error": "#EF4444",
            "tertiary": "#F59E0B"
          },
          fontFamily: {
            "headline": ["Hanken Grotesk", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- Custom Theme CSS -->
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body class="bg-surface font-mono text-on-surface antialiased min-h-screen flex flex-col pb-20 md:pb-0">

  <!-- Top Sticky Navigation Bar -->
  <header class="fixed top-0 left-0 w-full z-50 bg-white border-b-2 border-[#18181B] shadow-[0_3px_0px_#18181B]">
    <div class="h-16 max-w-6xl mx-auto px-4 flex items-center justify-between gap-4">
      
      <!-- Brand Logo & Badge -->
      <a href="#" onclick="App.navigateTo('dashboard'); return false;" class="flex items-center gap-2.5 select-none">
        <span class="text-2xl">😼</span>
        <div class="flex flex-col">
          <div class="flex items-center gap-1.5">
            <span class="font-headline text-xl font-bold tracking-tight text-[#18181B]">BunkWise</span>
            <span class="px-1.5 py-0.2 bg-emerald-100 text-emerald-900 text-[10px] font-bold border border-[#18181B] rounded shadow-[1px_1px_0px_#18181B]">Codédex</span>
          </div>
          <span class="text-[9px] text-slate-500 font-bold hidden sm:inline">Know your attendance. Know your freedom.</span>
        </div>
      </a>

      <!-- Desktop Nav Tabs -->
      <nav class="hidden lg:flex items-center gap-1">
        <button data-nav-tab="dashboard" class="nav-tab-btn active">
          <span>⚡</span>
          <span>Dashboard</span>
        </button>
        <button data-nav-tab="timetable" class="nav-tab-btn">
          <span>📅</span>
          <span>Timetable & OCR</span>
        </button>
        <button data-nav-tab="attendance" class="nav-tab-btn">
          <span>📊</span>
          <span>Attendance Matrix</span>
        </button>
        <button data-nav-tab="planner" class="nav-tab-btn">
          <span>🧮</span>
          <span>Bunk Planner</span>
        </button>
        <button data-nav-tab="settings" class="nav-tab-btn">
          <span>⚙️</span>
          <span>Settings / Vault</span>
        </button>
      </nav>

      <!-- Right Side Live Attendance Pulse Pill -->
      <div class="flex items-center gap-2">
        <div id="header-pulse-badge" class="hidden sm:flex items-center gap-1.5 px-2.5 py-1 bg-[#FEECEE] border-2 border-[#18181B] rounded shadow-[2px_2px_0px_#18181B]">
          <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
          <span class="text-xs font-bold text-red-600 tracking-tight">Attendance: 64.96% (Panic Mode 🙀)</span>
        </div>

        <button onclick="App.navigateTo('settings')" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 flex items-center justify-center border-2 border-[#18181B] shadow-[2px_2px_0px_#18181B]" title="Settings">
          <span class="material-symbols-outlined text-[18px]">settings</span>
        </button>
      </div>

    </div>
  </header>

  <!-- Main View Container -->
  <main class="w-full pt-20 px-4 flex-1">
    <div id="app-main-content">
      <!-- Views dynamically injected here via Vanilla JS router -->
    </div>
  </main>

  <!-- Mobile Bottom Sticky Navigation Bar -->
  <nav class="lg:hidden fixed bottom-0 left-0 w-full bg-white border-t-2 border-[#18181B] shadow-[0_-3px_0px_#18181B] z-40 flex items-center justify-around px-1 py-1">
    <button data-mobile-tab="dashboard" class="mobile-nav-btn active">
      <span class="material-symbols-outlined text-[20px]">speed</span>
      <span>Dashboard</span>
    </button>
    <button data-mobile-tab="timetable" class="mobile-nav-btn">
      <span class="material-symbols-outlined text-[20px]">calendar_today</span>
      <span>Timetable</span>
    </button>
    <button data-mobile-tab="attendance" class="mobile-nav-btn">
      <span class="material-symbols-outlined text-[20px]">donut_large</span>
      <span>Attendance</span>
    </button>
    <button data-mobile-tab="planner" class="mobile-nav-btn">
      <span class="material-symbols-outlined text-[20px]">calculate</span>
      <span>Planner</span>
    </button>
    <button data-mobile-tab="settings" class="mobile-nav-btn">
      <span class="material-symbols-outlined text-[20px]">settings</span>
      <span>Vault</span>
    </button>
  </nav>

  <!-- Footer -->
  <footer class="w-full bg-white border-t-2 border-[#18181B] py-6 mt-12">
    <div class="max-w-6xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
      <div class="flex items-center gap-2">
        <span class="font-headline font-bold text-sm text-[#18181B]">BunkWise</span>
        <span class="text-slate-500">• Know your attendance. Know your freedom.</span>
      </div>
      <div class="flex items-center gap-3 text-slate-600">
        <span>Codédex Hackathon Edition</span>
        <span>•</span>
        <span class="text-emerald-700 font-bold">100% Client-Side Privacy</span>
        <span>•</span>
        <button onclick="SettingsView.resetToStudentDemo()" class="underline font-bold text-[#18181B]">
          Reset Demo
        </button>
      </div>
    </div>
  </footer>

  <!-- Scripts in dependency order (Zero Node/Build tools required!) -->
  <script src="js/data/demo-data.js"></script>
  <script src="js/core/bunk-engine.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/date-utils.js"></script>
  <script src="js/ocr/ocr-service.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/dashboard.js"></script>
  <script src="js/ui/timetable-view.js"></script>
  <script src="js/ui/attendance-view.js"></script>
  <script src="js/ui/planner-view.js"></script>
  <script src="js/ui/settings-view.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
